name: Warrenfall — bilan hybride (migration)

on:
  workflow_call:
    inputs:
      relay:
        type: boolean
        default: false
      mode:
        type: string
        default: simulation
    secrets:
      WARRENFALL_STATE_TOKEN:
        required: true
      WARRENFALL_BACKUP_SIGNING_KEY:
        required: true
      CLOUDINARY_CLOUD_NAME:
        required: true
      CLOUDINARY_API_KEY:
        required: true
      CLOUDINARY_API_SECRET:
        required: true
      TRELLO_BOARD_ID:
        required: true
      TRELLO_API_KEY:
        required: true
      TRELLO_TOKEN:
        required: true
      DISCORD_WEBHOOK_BILAN:
        required: true
      DISCORD_WEBHOOK_CLOUDINARY:
        required: true
      DISCORD_WEBHOOK_TRELLO:
        required: true
  schedule:
    # UTC explicite ; schedule_gate retient 20:07 Europe/Paris selon la saison.
    - cron: '7 18 * * *'
    - cron: '7 19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Mode (application seulement après validation du relais Windows)
        type: choice
        default: simulation
        options: [simulation, appliquer, test-discord]

permissions:
  contents: read

concurrency:
  group: warrenfall-hybrid
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.paris.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Leven-Anju-Yuki/warrenfall
          ref: ${{ github.repository == 'Leven-Anju-Yuki/warrenfall' && github.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: paris
        env:
          WARRENFALL_RELAY_CALL: ${{ inputs.relay }}
          WARRENFALL_STATE_REPO: ${{ vars.WARRENFALL_STATE_REPO }}
        run: python -B tools/automation/schedule_gate.py

  simulations:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Leven-Anju-Yuki/warrenfall
          ref: ${{ github.repository == 'Leven-Anju-Yuki/warrenfall' && github.sha || 'main' }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/agent_lapinous/requirements.txt
      - name: Tests sans Cloudinary, Trello ni Discord
        run: python -B -m unittest discover -s tools/automation -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la sauvegarde permanente sur fichiers fictifs
        run: node tools/test-permanent-backup.mjs
      - name: Vérifier les règles Trello existantes
        working-directory: tools/agent_lapinous
        run: python -B -m unittest test_suivi_trello test_chaine_agent test_fiabilisation test_validation_resilience

  daily:
    needs: [schedule-gate, simulations]
    # Absent par défaut : publier le fichier ne réactive aucune automatisation.
    if: always() && needs.schedule-gate.outputs.run == 'true' && vars.WARRENFALL_HYBRID_ENABLED == 'true' && inputs.mode != 'test-discord'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: warrenfall-automation
    env:
      WARRENFALL_STATE_REPO: ${{ vars.WARRENFALL_STATE_REPO }}
      WARRENFALL_STATE_TOKEN: ${{ secrets.WARRENFALL_STATE_TOKEN }}
      WARRENFALL_BACKUP_SIGNING_KEY: ${{ secrets.WARRENFALL_BACKUP_SIGNING_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
      TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
      TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
      DISCORD_WEBHOOK_BILAN: ${{ secrets.DISCORD_WEBHOOK_BILAN }}
      DISCORD_WEBHOOK_CLOUDINARY: ${{ secrets.DISCORD_WEBHOOK_CLOUDINARY }}
      DISCORD_WEBHOOK_TRELLO: ${{ secrets.DISCORD_WEBHOOK_TRELLO }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Leven-Anju-Yuki/warrenfall
          ref: ${{ github.repository == 'Leven-Anju-Yuki/warrenfall' && github.sha || 'main' }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/agent_lapinous/requirements.txt
      - name: Chaîne distante (application uniquement après validation)
        if: needs.simulations.result == 'success'
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          APPLY_ENABLED: ${{ vars.WARRENFALL_HYBRID_APPLY_VALIDATED }}
        run: |
          args=()
          if [ "$APPLY_ENABLED" = true ] && { [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$REQUESTED_MODE" = appliquer ]; }; then
            args+=(--apply)
          fi
          python -B tools/automation/remote.py "${args[@]}"
      - name: Envoi de secours indépendant des traitements métier
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'appliquer')
        run: python -B tools/automation/report_fallback.py
      - name: Résultat
        if: always()
        run: |
          echo 'Rapport détaillé conservé dans le dépôt privé d’état ; aucun artifact public.' >> "$GITHUB_STEP_SUMMARY"

  notification-test:
    needs: simulations
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test-discord'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: warrenfall-automation
    env:
      WARRENFALL_STATE_REPO: ${{ vars.WARRENFALL_STATE_REPO }}
      WARRENFALL_STATE_TOKEN: ${{ secrets.WARRENFALL_STATE_TOKEN }}
      WARRENFALL_BACKUP_SIGNING_KEY: ${{ secrets.WARRENFALL_BACKUP_SIGNING_KEY }}
      TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
      TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
      TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
      DISCORD_WEBHOOK_BILAN: ${{ secrets.DISCORD_WEBHOOK_BILAN }}
      DISCORD_WEBHOOK_CLOUDINARY: ${{ secrets.DISCORD_WEBHOOK_CLOUDINARY }}
      DISCORD_WEBHOOK_TRELLO: ${{ secrets.DISCORD_WEBHOOK_TRELLO }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Leven-Anju-Yuki/warrenfall
          ref: ${{ github.repository == 'Leven-Anju-Yuki/warrenfall' && github.sha || 'main' }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/agent_lapinous/requirements.txt
      - name: Test réel des pièces jointes — lectures uniquement
        run: python -B tools/automation/report_probe.py --source actions --send
